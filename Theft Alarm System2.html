<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardian Sound Detector</title>

<style>
body {
  font-family: Arial;
  background: black;
  color: lime;
  text-align: center;
}

.container {
  border: 2px solid lime;
  padding: 20px;
  max-width: 400px;
  margin: auto;
  margin-top: 50px;
}

button {
  padding: 10px;
  margin: 5px;
  border: 1px solid lime;
  background: black;
  color: lime;
  cursor: pointer;
}

#display {
  height: 60px;
  margin-bottom: 15px;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="container">
  <h2>🛡️ GUARDIAN</h2>

  <div id="display">System Standby</div>

  <label>Sensitivity: </label>
  <input type="range" id="sens" min="1" max="100" value="50">

  <br><br>

  <button onclick="start()">Start</button>
  <button onclick="stop()">Stop</button>
</div>

<script>
let audioCtx, analyser, mic;
let running = false;
let alarmPlaying = false;

async function start() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    mic = await navigator.mediaDevices.getUserMedia({ audio: true });

    const source = audioCtx.createMediaStreamSource(mic);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    source.connect(analyser);

    running = true;
    document.getElementById("display").innerText = "Monitoring...";
    detect();
  } catch (e) {
    document.getElementById("display").innerText = "Microphone permission needed!";
  }
}

function playBeep() {
  if (alarmPlaying) return;
  alarmPlaying = true;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.setValueAtTime(800, audioCtx.currentTime);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();

  setTimeout(() => {
    osc.stop();
    alarmPlaying = false;
  }, 300);
}

function detect() {
  if (!running) return;

  let data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);

  let avg = data.reduce((a, b) => a + b, 0) / data.length;
  let threshold = 120 - document.getElementById("sens").value;

  if (avg > threshold) {
    document.getElementById("display").innerText = "⚠ Noise Detected!";
    playBeep();
  } else {
    document.getElementById("display").innerText = "Monitoring...";
  }

  requestAnimationFrame(detect);
}

function stop() {
  running = false;
  if (mic) mic.getTracks().forEach(t => t.stop());
  document.getElementById("display").innerText = "Stopped";
}
</script>

</body>
</html>
